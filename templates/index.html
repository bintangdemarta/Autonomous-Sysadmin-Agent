<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autonomous Sysadmin Agent Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f4;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
            border-bottom: 1px solid #ddd;
            padding-bottom: 10px;
        }
        .command-section {
            margin: 20px 0;
        }
        .command-input {
            width: 70%;
            padding: 10px;
            font-size: 16px;
        }
        .command-button {
            padding: 10px 20px;
            font-size: 16px;
            background: #007bff;
            color: white;
            border: none;
            cursor: pointer;
            margin-left: 10px;
        }
        .command-button:hover {
            background: #0056b3;
        }
        .output {
            background: #f8f9fa;
            border: 1px solid #ddd;
            padding: 15px;
            margin-top: 15px;
            white-space: pre-wrap;
            max-height: 400px;
            overflow-y: auto;
        }
        .history {
            margin-top: 30px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #f2f2f2;
        }
        .success { color: green; }
        .error { color: red; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Autonomous Sysadmin Agent Dashboard</h1>
        
        <div class="command-section">
            <h2>Execute Command</h2>
            <input type="text" id="commandInput" class="command-input" placeholder="Enter command (e.g., 'cek ram', 'cek disk', 'cek uptime')" />
            <button onclick="executeCommand()" class="command-button">Execute</button>
            
            <div id="output" class="output"></div>
        </div>
        
        <div class="history">
            <h2>Command History</h2>
            <button onclick="getHistory()" class="command-button">Refresh History</button>
            <button onclick="clearHistory()" class="command-button" style="background: #dc3545;">Clear History</button>
            <table id="historyTable">
                <thead>
                    <tr>
                        <th>Timestamp</th>
                        <th>Command</th>
                        <th>Status</th>
                        <th>Output</th>
                    </tr>
                </thead>
                <tbody id="historyBody">
                </tbody>
            </table>
        </div>
    </div>

    <script>
        async function executeCommand() {
            const commandInput = document.getElementById('commandInput');
            const outputDiv = document.getElementById('output');
            const command = commandInput.value.trim();
            
            if (!command) {
                outputDiv.textContent = 'Please enter a command';
                return;
            }
            
            try {
                const response = await fetch('/execute', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ command: command })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    outputDiv.innerHTML = '<span class="success">Success:</span>\n' + result.output;
                } else {
                    outputDiv.innerHTML = '<span class="error">Error:</span>\n' + result.output;
                }
            } catch (error) {
                outputDiv.textContent = 'Error: ' + error.message;
            }
        }
        
        async function getHistory() {
            try {
                const response = await fetch('/history');
                const history = await response.json();
                
                const historyBody = document.getElementById('historyBody');
                historyBody.innerHTML = '';
                
                history.forEach(entry => {
                    const row = document.createElement('tr');
                    
                    // Determine status class
                    const statusClass = entry.success ? 'success' : 'error';
                    const statusText = entry.success ? 'Success' : 'Error';
                    
                    row.innerHTML = `
                        <td>${entry.timestamp}</td>
                        <td>${entry.input}</td>
                        <td><span class="${statusClass}">${statusText}</span></td>
                        <td><pre style="margin:0;white-space:pre-wrap;">${entry.output}</pre></td>
                    `;
                    
                    historyBody.appendChild(row);
                });
            } catch (error) {
                console.error('Error fetching history:', error);
            }
        }
        
        async function clearHistory() {
            try {
                await fetch('/history/clear', {
                    method: 'POST'
                });
                
                document.getElementById('historyBody').innerHTML = '';
                document.getElementById('output').textContent = 'History cleared successfully';
            } catch (error) {
                console.error('Error clearing history:', error);
            }
        }
        
        // Allow Enter key to execute command
        document.getElementById('commandInput').addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                executeCommand();
            }
        });
        
        // Load history on page load
        window.onload = function() {
            getHistory();
        };
    </script>
</body>
</html>

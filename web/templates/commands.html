<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Commands - Nexus-CLI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/">Nexus-CLI</a>
            <div class="navbar-nav">
                <a class="nav-link" href="/">Dashboard</a>
                <a class="nav-link active" href="/commands">Commands</a>
            </div>
        </div>
    </nav>
    
    <div class="container mt-4">
        <h1>Command Management</h1>
        
        <div class="row">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5>Execute Command</h5>
                    </div>
                    <div class="card-body">
                        <form id="commandForm">
                            <div class="mb-3">
                                <label for="commandInput" class="form-label">Enter Command</label>
                                <input type="text" class="form-control" id="commandInput" placeholder="e.g., cek ram, cek disk, cek uptime">
                            </div>
                            <button type="submit" class="btn btn-primary">Execute</button>
                        </form>
                        
                        <div id="result" class="mt-3" style="display:none;">
                            <h6>Result:</h6>
                            <pre id="output" class="bg-light p-2"></pre>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5>Command History</h5>
                        <button id="clearHistory" class="btn btn-sm btn-danger">Clear</button>
                    </div>
                    <div class="card-body">
                        <div id="historyList">
                            <!-- History will be loaded here -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('commandForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const command = document.getElementById('commandInput').value;
            if (!command.trim()) {
                alert('Please enter a command');
                return;
            }
            
            try {
                const response = await fetch('/execute', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ command: command })
                });
                
                const result = await response.json();
                
                document.getElementById('result').style.display = 'block';
                document.getElementById('output').textContent = result.output;
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('output').textContent = 'Error: ' + error.message;
                document.getElementById('result').style.display = 'block';
            }
        });
        
        // Load history on page load
        async function loadHistory() {
            try {
                const response = await fetch('/history');
                const history = await response.json();
                
                const historyList = document.getElementById('historyList');
                historyList.innerHTML = '';
                
                if (history.length === 0) {
                    historyList.innerHTML = '<p class="text-muted">No command history yet.</p>';
                    return;
                }
                
                history.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'border-bottom pb-2 mb-2';
                    div.innerHTML = `
                        <small class="text-muted">${item.timestamp}</small>
                        <div><strong>${item.input}</strong></div>
                        <div class="small">${item.output.substring(0, 100)}${item.output.length > 100 ? '...' : ''}</div>
                    `;
                    historyList.appendChild(div);
                });
            } catch (error) {
                console.error('Error loading history:', error);
            }
        }
        
        // Clear history
        document.getElementById('clearHistory').addEventListener('click', async function() {
            try {
                await fetch('/history/clear', {
                    method: 'POST'
                });
                loadHistory(); // Reload history after clearing
            } catch (error) {
                console.error('Error clearing history:', error);
            }
        });
        
        // Load history when page loads
        loadHistory();
    </script>
</body>
</html>

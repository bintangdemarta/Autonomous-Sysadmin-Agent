version: "3.8"

services:
  nexus-cli:
    build: .
    volumes:
      # Mount the current directory to the app directory in the container
      - .:/app
      # Mount SSH directory to allow SSH key access
      - ~/.ssh:/home/appuser/.ssh:ro
      # Mount config directory separately if needed
      - ./config:/app/config
    environment:
      - NEXUS_SSH_HOST=${NEXUS_SSH_HOST:-localhost}
      - NEXUS_SSH_USER=${NEXUS_SSH_USER:-root}
      - NEXUS_SSH_PORT=${NEXUS_SSH_PORT:-22}
      - NEXUS_SSH_PASSWORD=${NEXUS_SSH_PASSWORD}
      - NEXUS_SSH_KEY_PATH=${NEXUS_SSH_KEY_PATH}
    # For interactive use
    stdin_open: true
    tty: true
    # If you need to expose ports for SSH tunneling
    ports:
      - "2222:22"
    # Set working directory
    working_dir: /app